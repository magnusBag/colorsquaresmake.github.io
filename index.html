<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Color Squares</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--background-color, #f7f5f0);
        color: var(--text-color, #292824);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .site-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 32px 38px;
        pointer-events: none;
      }

      .brand {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .header-note, .hint {
        margin: 0;
        color: var(--muted-color, #77736c);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .background-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 7px 5px 12px;
        border-radius: 20px;
        background: #fff;
        color: #292824;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        pointer-events: auto;
      }

      .background-picker input {
        width: 32px;
        height: 28px;
        padding: 2px;
        border: 1px solid #77736c;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      .background-picker input:focus-visible { outline: 3px solid #292824; outline-offset: 2px; }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 110px 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(var(--columns, 2), var(--cell-size));
        grid-auto-rows: var(--cell-size);
        gap: clamp(14px, 2.2vw, 28px);
        --cell-size: clamp(120px, 17vw, 190px);
      }

      .square {
        position: relative;
        grid-column: span var(--col-span, 1);
        grid-row: span var(--row-span, 1);
        min-width: 0;
        background: var(--square-color);
        border-radius: 2px;
        box-shadow: 0 12px 28px rgba(48, 43, 34, 0.09);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .square:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 34px rgba(48, 43, 34, 0.14);
      }

      .square:focus-within {
        outline: 3px solid #292824;
        outline-offset: 5px;
      }

      .square.is-dragging { opacity: 0.25; }

      .drag-ghost {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        opacity: 0.94;
        box-shadow: 0 24px 45px rgba(48, 43, 34, 0.22);
      }

      .square-picker {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .square-name {
        position: absolute;
        bottom: 12px;
        left: 12px;
        max-width: calc(100% - 24px);
        overflow: hidden;
        color: var(--square-label-color);
        font-size: 12px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      .cmyk-popover {
        position: fixed;
        z-index: 20;
        width: 310px;
        max-width: calc(100vw - 32px);
        padding: 18px;
        border: 1px solid #dedbd5;
        border-radius: 14px;
        background: #fff;
        color: #292824;
        box-shadow: 0 20px 55px rgba(41, 40, 36, 0.2);
      }

      .cmyk-popover[hidden] { display: none; }
      .picker-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
      .picker-heading h2 { margin: 0; font-size: 15px; }
      .picker-close { border: 0; background: transparent; color: #292824; font-size: 24px; line-height: 1; cursor: pointer; }
      .picker-name { display: grid; gap: 6px; margin-bottom: 16px; font-size: 12px; font-weight: 700; }
      .picker-name input { width: 100%; padding: 9px 10px; border: 1px solid #c8c4bd; border-radius: 6px; font: inherit; }
      .channel-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 55px; align-items: center; gap: 10px; margin: 11px 0; font-size: 13px; font-weight: 700; }
      .channel-row input[type="range"] { width: 100%; accent-color: #292824; }
      .channel-row input[type="number"] { width: 55px; padding: 6px 4px; border: 1px solid #c8c4bd; border-radius: 5px; font: inherit; text-align: center; }
      .picker-preview { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e8e5df; font-size: 12px; }
      .preview-swatch { width: 28px; height: 28px; border: 1px solid rgba(0,0,0,.12); border-radius: 5px; background: var(--preview-color); }
      .picker-note { margin: 10px 0 0; color: #77736c; font-size: 11px; line-height: 1.4; }

      .square-control {
        position: absolute;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 24px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(41, 40, 36, 0.72);
        color: #fff;
        font: 18px/1 Arial, Helvetica, sans-serif;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease;
      }

      .square:hover .square-control,
      .square:focus-within .square-control,
      .drag-ghost .square-control { opacity: 1; pointer-events: auto; }
      .square-control:hover { background: #292824; }
      .square-control:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .drag-handle { top: 8px; left: 6px; font-size: 17px; cursor: grab; touch-action: none; }
      .drag-handle:active { cursor: grabbing; }
      .remove-button { top: 8px; right: 6px; }
      .span-controls { position: absolute; z-index: 1; top: 8px; left: 50%; display: flex; gap: 4px; transform: translateX(-50%); pointer-events: none; }
      .span-button { position: static; width: 26px; height: 26px; border-radius: 16px; font-size: 11px; font-weight: 700; }

      .hint {
        position: fixed;
        bottom: 40px;
        left: 38px;
      }

      .add-button {
        position: fixed;
        right: 32px;
        bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--button-background, #292824);
        color: var(--button-foreground, #fff);
        font: 300 39px/1 Arial, Helvetica, sans-serif;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(41, 40, 36, 0.18);
        transition: transform 180ms ease, background 180ms ease;
      }

      .add-button:hover { transform: rotate(90deg); background: var(--button-hover, #48443d); }
      .add-button:focus-visible { outline: 3px solid var(--text-color, #292824); outline-offset: 4px; }

      @media (max-width: 600px) {
        .site-header { padding: 24px; gap: 8px; }
        .header-note { display: none; }
        main { padding: 90px 20px 110px; }
        .grid { gap: 14px; --cell-size: min(39vw, 170px); }
        .hint { left: 24px; bottom: 38px; max-width: 52%; line-height: 1.4; }
        .add-button { right: 22px; bottom: 22px; width: 58px; height: 58px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .square, .add-button { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1 class="brand">Color Squares</h1>
      <div class="header-actions">
        <p class="header-note">A little space to play with color</p>
        <label class="background-picker">Background <input id="background-color" type="color" value="#f7f5f0" /></label>
      </div>
    </header>

    <main>
      <div class="grid" id="grid" aria-label="Color squares"></div>
    </main>

    <section class="cmyk-popover" id="cmyk-picker" role="dialog" aria-label="CMYK color picker" hidden>
      <div class="picker-heading"><h2>Color</h2><button class="picker-close" id="picker-close" type="button" aria-label="Close color picker">×</button></div>
      <label class="picker-name">Name <input id="color-name" type="text" maxlength="80" placeholder="e.g. Nile blue" /></label>
      <div id="channels"></div>
      <div class="picker-preview"><span class="preview-swatch" id="preview-swatch"></span><span id="preview-hex"></span></div>
      <p class="picker-note">Screen colors are an approximation of CMYK print colors.</p>
    </section>

    <p class="hint">Click to edit CMYK · drag ☰ to move · ↔ / ↕ to resize · × to remove</p>
    <button class="add-button" id="add-square" type="button" aria-label="Add a square" title="Add a square">+</button>

    <script>
      const grid = document.querySelector('#grid');
      const addButton = document.querySelector('#add-square');
      const colors = ['#f27864', '#6769dd', '#eebd59', '#74b99b', '#cb8bbd', '#75a8cb'];
      const storageKey = 'color-squares-state-v1';
      const backgroundKey = 'color-squares-background-v1';
      const defaultBackground = '#f7f5f0';
      const backgroundPicker = document.querySelector('#background-color');
      const pickerPanel = document.querySelector('#cmyk-picker');
      const nameInput = document.querySelector('#color-name');
      const previewSwatch = document.querySelector('#preview-swatch');
      const previewHex = document.querySelector('#preview-hex');
      const channelNames = { c: 'Cyan', m: 'Magenta', y: 'Yellow', k: 'Black' };
      let activeSquare = null;

      document.querySelector('#channels').innerHTML = Object.entries(channelNames).map(([channel, label]) => `
        <div class="channel-row" data-channel="${channel}">
          <span aria-hidden="true">${channel.toUpperCase()}</span>
          <input type="range" min="0" max="100" value="0" aria-label="${label}" />
          <input type="number" min="0" max="100" step="1" value="0" aria-label="${label} percent" />
        </div>
      `).join('');

      function cmykToHex({ c, m, y, k }) {
        const hex = [c, m, y].map((channel) =>
          Math.round(255 * (1 - channel / 100) * (1 - k / 100))
            .toString(16).padStart(2, '0')
        ).join('');
        return `#${hex}`;
      }

      function hexToCmyk(hex) {
        const [r, g, b] = [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16) / 255);
        const black = 1 - Math.max(r, g, b);
        if (black === 1) return { c: 0, m: 0, y: 0, k: 100 };
        return {
          c: Math.round(100 * (1 - r - black) / (1 - black)),
          m: Math.round(100 * (1 - g - black) / (1 - black)),
          y: Math.round(100 * (1 - b - black) / (1 - black)),
          k: Math.round(100 * black)
        };
      }

      function validCmyk(value) {
        return value && Object.keys(channelNames).every((channel) =>
          Number.isInteger(value[channel]) && value[channel] >= 0 && value[channel] <= 100
        );
      }

      function setSquareColor(square, color) {
        square.dataset.color = color;
        square.style.setProperty('--square-color', color);
        const [r, g, b] = [1, 3, 5].map((index) => parseInt(color.slice(index, index + 2), 16));
        square.style.setProperty('--square-label-color', 0.2126 * r + 0.7152 * g + 0.0722 * b > 150 ? '#292824' : '#fff');
      }

      function positionPicker() {
        if (!activeSquare || pickerPanel.hidden) return;
        const square = activeSquare.getBoundingClientRect();
        const panel = pickerPanel.getBoundingClientRect();
        const left = Math.max(16, Math.min(square.left, window.innerWidth - panel.width - 16));
        const below = square.bottom + 12;
        const above = square.top - panel.height - 12;
        const top = below + panel.height <= window.innerHeight - 16 ? below
          : above >= 16 ? above
          : Math.max(16, Math.min(below, window.innerHeight - panel.height - 16));
        pickerPanel.style.left = `${left}px`;
        pickerPanel.style.top = `${top}px`;
      }

      function closePicker(restoreFocus = false) {
        const square = activeSquare;
        activeSquare = null;
        pickerPanel.hidden = true;
        if (restoreFocus && square?.isConnected) square.querySelector('.square-picker').focus();
      }

      function openPicker(square) {
        activeSquare = square;
        nameInput.value = square.dataset.name || '';
        document.querySelectorAll('.channel-row').forEach((row) => {
          const value = square.cmyk[row.dataset.channel];
          row.querySelector('input[type="range"]').value = value;
          row.querySelector('input[type="number"]').value = value;
        });
        previewSwatch.style.setProperty('--preview-color', square.dataset.color);
        previewHex.textContent = square.dataset.color.toUpperCase();
        pickerPanel.hidden = false;
        positionPicker();
        nameInput.focus();
      }

      function applyCmyk() {
        if (!activeSquare) return;
        activeSquare.cmyk = Object.fromEntries([...document.querySelectorAll('.channel-row')].map((row) => [
          row.dataset.channel, Number(row.querySelector('input[type="range"]').value)
        ]));
        const color = cmykToHex(activeSquare.cmyk);
        setSquareColor(activeSquare, color);
        previewSwatch.style.setProperty('--preview-color', color);
        previewHex.textContent = color.toUpperCase();
        saveState();
      }

      document.querySelectorAll('.channel-row').forEach((row) => {
        const range = row.querySelector('input[type="range"]');
        const number = row.querySelector('input[type="number"]');
        range.addEventListener('input', () => { number.value = range.value; applyCmyk(); });
        number.addEventListener('input', () => {
          if (number.value === '') return;
          const value = Math.max(0, Math.min(100, Math.round(Number(number.value))));
          range.value = value;
          applyCmyk();
        });
        number.addEventListener('change', () => { number.value = range.value; });
      });

      nameInput.addEventListener('input', () => {
        if (!activeSquare) return;
        activeSquare.dataset.name = nameInput.value;
        const label = activeSquare.querySelector('.square-name');
        label.textContent = nameInput.value;
        label.hidden = !nameInput.value;
        saveState();
      });
      document.querySelector('#picker-close').addEventListener('click', () => closePicker(true));
      document.addEventListener('pointerdown', (event) => {
        if (activeSquare && !pickerPanel.contains(event.target) && !activeSquare.contains(event.target)) closePicker();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && activeSquare) closePicker(true);
      });

      function setBackground(color) {
        backgroundPicker.value = color;
        document.documentElement.style.setProperty('--background-color', color);
        const channels = [1, 3, 5].map((index) => parseInt(color.slice(index, index + 2), 16) / 255)
          .map((value) => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
        const luminance = channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
        const textColor = luminance < 0.179 ? '#fff' : '#292824';
        document.documentElement.style.setProperty('--text-color', textColor);
        document.documentElement.style.setProperty('--muted-color', textColor);
        document.documentElement.style.setProperty('--button-background', textColor === '#fff' ? '#fff' : '#292824');
        document.documentElement.style.setProperty('--button-foreground', textColor === '#fff' ? '#292824' : '#fff');
        document.documentElement.style.setProperty('--button-hover', textColor === '#fff' ? '#e7e7e7' : '#48443d');
      }

      function loadBackground() {
        try {
          const saved = localStorage.getItem(backgroundKey);
          return saved && /^#[0-9a-f]{6}$/i.test(saved) ? saved : defaultBackground;
        } catch (_) { return defaultBackground; }
      }
      function saveState() {
        const state = [...grid.children].map((square) => ({
          color: square.dataset.color,
          cmyk: square.cmyk,
          name: square.dataset.name || '',
          columns: Number(square.dataset.columns),
          rows: Number(square.dataset.rows)
        }));
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {}
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === null) return null;
          const state = JSON.parse(saved);
          if (!Array.isArray(state)) return null;
          return state.filter((item) =>
            item && /^#[0-9a-f]{6}$/i.test(item.color)
            && [1, 2].includes(item.columns) && [1, 2].includes(item.rows)
          ).map((item) => ({
            ...item,
            cmyk: validCmyk(item.cmyk) ? item.cmyk : hexToCmyk(item.color),
            name: typeof item.name === 'string' ? item.name.slice(0, 80) : ''
          }));
        } catch (_) { return null; }
      }

      function updateGrid() {
        const maxColumns = window.innerWidth <= 600 ? 2 : window.innerWidth <= 900 ? 3 : 4;
        const neededColumns = [...grid.children].reduce((sum, square) => sum + Number(square.dataset.columns), 0);
        grid.style.setProperty('--columns', Math.max(1, Math.min(maxColumns, neededColumns)));
      }

      function updateLabels() {
        [...grid.children].forEach((square, index) => {
          const number = index + 1;
          square.querySelector('.square-picker').setAttribute('aria-label', `Edit CMYK color for square ${number}`);
          square.querySelector('.remove-button').setAttribute('aria-label', `Remove square ${number}`);
          square.querySelector('.drag-handle').setAttribute('aria-label', `Move square ${number}; drag or use arrow keys`);
          square.querySelector('.column-button').setAttribute('aria-label', `Make square ${number} ${square.dataset.columns === '1' ? 'two columns' : 'one column'} wide`);
          square.querySelector('.row-button').setAttribute('aria-label', `Make square ${number} ${square.dataset.rows === '1' ? 'two rows' : 'one row'} tall`);
        });
      }

      function animateReorder(change) {
        const before = new Map([...grid.children].map((square) => [square, square.getBoundingClientRect()]));
        change();
        [...grid.children].forEach((square) => {
          if (square.classList.contains('is-dragging')) return;
          const old = before.get(square);
          if (!old) return;
          const now = square.getBoundingClientRect();
          const dx = old.left - now.left;
          const dy = old.top - now.top;
          if (dx || dy) square.animate(
            [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
            { duration: 250, easing: 'cubic-bezier(.2,.8,.2,1)' }
          );
        });
      }

      function startDrag(event, square) {
        if (event.button !== 0) return;
        event.preventDefault();
        if (activeSquare) closePicker();
        const startX = event.clientX;
        const startY = event.clientY;
        let ghost = null;

        function move(moveEvent) {
          if (moveEvent.pointerId !== event.pointerId) return;
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (!ghost && Math.hypot(dx, dy) < 5) return;
          if (!ghost) {
            const rect = square.getBoundingClientRect();
            ghost = square.cloneNode(true);
            ghost.classList.add('drag-ghost');
            ghost.inert = true;
            ghost.setAttribute('aria-hidden', 'true');
            ghost.style.left = `${rect.left}px`;
            ghost.style.top = `${rect.top}px`;
            ghost.style.width = `${rect.width}px`;
            ghost.style.height = `${rect.height}px`;
            ghost.style.gridColumn = 'auto';
            ghost.style.gridRow = 'auto';
            document.body.append(ghost);
            square.classList.add('is-dragging');
          }
          ghost.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

          const target = document.elementsFromPoint(moveEvent.clientX, moveEvent.clientY)
            .map((element) => element.closest?.('.square'))
            .find((element) => element && element !== square && element !== ghost);
          if (!target) return;

          const rect = target.getBoundingClientRect();
          const nearMiddle = Math.abs(moveEvent.clientY - (rect.top + rect.height / 2)) < rect.height / 3;
          const after = nearMiddle
            ? moveEvent.clientX > rect.left + rect.width / 2
            : moveEvent.clientY > rect.top + rect.height / 2;
          if (after && target.nextElementSibling === square) return;
          if (!after && square.nextElementSibling === target) return;

          animateReorder(() => {
            if (after) target.after(square);
            else target.before(square);
          });
          updateLabels();
        }

        function finish(endEvent) {
          if (endEvent.pointerId !== event.pointerId) return;
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', finish);
          window.removeEventListener('pointercancel', finish);
          if (ghost) {
            ghost.remove();
            square.classList.remove('is-dragging');
            saveState();
          }
        }

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', finish);
        window.addEventListener('pointercancel', finish);
      }

      function createSquare(color, columns = 1, rows = 1, cmyk = hexToCmyk(color), name = '') {
        const square = document.createElement('div');
        const picker = document.createElement('button');
        const nameLabel = document.createElement('span');
        const dragHandle = document.createElement('button');
        const removeButton = document.createElement('button');
        const spanControls = document.createElement('div');
        const columnButton = document.createElement('button');
        const rowButton = document.createElement('button');

        square.className = 'square';
        square.cmyk = cmyk;
        square.dataset.name = name;
        setSquareColor(square, color);
        square.dataset.columns = columns;
        square.dataset.rows = rows;
        square.style.setProperty('--col-span', columns);
        square.style.setProperty('--row-span', rows);
        picker.className = 'square-picker';
        picker.type = 'button';
        picker.addEventListener('click', () => openPicker(square));
        nameLabel.className = 'square-name';
        nameLabel.textContent = name;
        nameLabel.hidden = !name;

        dragHandle.className = 'square-control drag-handle';
        dragHandle.type = 'button';
        dragHandle.textContent = '☰';
        dragHandle.addEventListener('pointerdown', (event) => startDrag(event, square));
        dragHandle.addEventListener('keydown', (event) => {
          const forward = event.key === 'ArrowRight' || event.key === 'ArrowDown';
          const backward = event.key === 'ArrowLeft' || event.key === 'ArrowUp';
          if (!forward && !backward) return;
          const neighbor = forward ? square.nextElementSibling : square.previousElementSibling;
          if (!neighbor) return;
          event.preventDefault();
          animateReorder(() => {
            if (forward) neighbor.after(square);
            else neighbor.before(square);
          });
          updateLabels();
          saveState();
        });

        removeButton.className = 'square-control remove-button';
        removeButton.type = 'button';
        removeButton.textContent = '×';
        removeButton.addEventListener('click', () => {
          if (activeSquare === square) closePicker();
          const nextFocus = square.nextElementSibling?.querySelector('.remove-button')
            || square.previousElementSibling?.querySelector('.remove-button')
            || addButton;
          animateReorder(() => {
            square.remove();
            updateGrid();
          });
          updateLabels();
          saveState();
          nextFocus.focus();
        });

        function makeSpanButton(button, axis, symbol) {
          button.className = `square-control span-button ${axis === 'columns' ? 'column-button' : 'row-button'}`;
          button.type = 'button';
          button.textContent = `${symbol} ${square.dataset[axis]}`;
          button.addEventListener('click', () => {
            const value = square.dataset[axis] === '1' ? 2 : 1;
            animateReorder(() => {
              square.dataset[axis] = value;
              square.style.setProperty(axis === 'columns' ? '--col-span' : '--row-span', value);
              updateGrid();
            });
            button.textContent = `${symbol} ${value}`;
            updateLabels();
            saveState();
          });
        }
        makeSpanButton(columnButton, 'columns', '↔');
        makeSpanButton(rowButton, 'rows', '↕');
        spanControls.className = 'span-controls';
        spanControls.append(columnButton, rowButton);
        square.append(picker, nameLabel, dragHandle, removeButton, spanControls);
        grid.append(square);
      }

      function addSquare() {
        createSquare(colors[grid.children.length % colors.length]);
        updateGrid();
        updateLabels();
        saveState();
      }

      function render(state) {
        if (activeSquare) closePicker();
        grid.replaceChildren();
        (state ?? [{ color: colors[0], columns: 1, rows: 1 }, { color: colors[1], columns: 1, rows: 1 }])
          .forEach(({ color, columns, rows, cmyk, name }) => createSquare(color, columns, rows, cmyk, name));
        updateGrid();
        updateLabels();
      }

      backgroundPicker.addEventListener('input', () => {
        setBackground(backgroundPicker.value);
        try { localStorage.setItem(backgroundKey, backgroundPicker.value); } catch (_) {}
      });
      addButton.addEventListener('click', addSquare);
      window.addEventListener('resize', () => { updateGrid(); positionPicker(); });
      window.addEventListener('scroll', positionPicker, true);
      window.addEventListener('storage', (event) => {
        if (event.key === storageKey) render(loadState());
        if (event.key === backgroundKey) setBackground(loadBackground());
      });
      render(loadState());
      setBackground(loadBackground());
    </script>
  </body>
</html>
