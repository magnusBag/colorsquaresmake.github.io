<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Color Squares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --ink: #292824;
        --muted: #6f6b64;
        --line: #e8e5df;
        --line-strong: #c8c4bd;
        --paper: #f7f5f0;
        --surface: #fff;
        --chip: rgba(255, 255, 255, 0.82);
        font-family: var(--font);
        --page-background: #f7f5f0;
        background: var(--page-background);
        color: #292824;
      }

      * { box-sizing: border-box; }
      button, input { font: inherit; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .site-header {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding: 32px 38px;
        pointer-events: none;
      }

      .brand, .header-note {
        margin: 0;
        padding: 7px 11px;
        border-radius: 999px;
        background: var(--chip);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: var(--ink);
      }

      .brand {
        font-size: 15px;
        font-stretch: 125%;
        font-weight: 750;
        letter-spacing: -0.01em;
      }

      .header-note { font-size: 13px; }

      main {
        width: 100%;
        height: 100vh;
        height: 100svh;
        height: 100dvh;
      }

      .grid {
        display: grid;
        width: 100%;
        height: 100%;
        gap: var(--square-gap, 0px);
        overflow: hidden;
      }

      .square {
        position: relative;
        min-width: 0;
        min-height: 0;
        container-type: size;
        border-radius: var(--square-radius, 0px);
        background: var(--square-color);
        transition: background-color 140ms ease;
      }

      .square.is-dragging { opacity: 0.25; }

      .drag-ghost {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        opacity: 0.94;
        box-shadow: 0 24px 45px rgba(48, 43, 34, 0.22);
      }

      .square-picker {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: inherit;
        outline: none;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }

      /* Reads like a chip in a printer's swatch book: name over code, bottom-left. */
      .swatch-label {
        position: absolute;
        bottom: 14px;
        left: 16px;
        display: grid;
        gap: 1px;
        max-width: calc(100% - 32px);
        color: var(--square-label-color);
        pointer-events: none;
      }

      .square-name, .square-hex { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .square-name { font-size: 14px; font-weight: 650; }
      .square-name[hidden] { display: none; }
      .square-hex { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; opacity: 0.72; }

      @container (max-width: 96px) or (max-height: 64px) {
        .swatch-label { display: none; }
      }

      .cmyk-popover {
        position: fixed;
        z-index: 20;
        width: 310px;
        max-width: calc(100vw - 32px);
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 20px 55px rgba(41, 40, 36, 0.2);
      }

      .cmyk-popover:not([hidden]) {
        animation: popover-in 140ms ease-out;
      }

      @keyframes popover-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      .cmyk-popover[hidden] { display: none; }
      .picker-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
      .picker-heading h2 { margin: 0; font-size: 16px; font-stretch: 112%; font-weight: 700; }
      .picker-close { display: grid; place-items: center; width: 32px; height: 32px; margin: -6px -8px -6px 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; }
      .picker-close:hover { background: var(--paper); }
      .picker-close:focus-visible { outline: 3px solid var(--ink); outline-offset: 1px; }
      .picker-name { display: grid; gap: 6px; margin-bottom: 16px; font-size: 12px; font-weight: 700; }
      .picker-name input { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; }
      .picker-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
      .picker-tab { padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: 700 12px var(--font); cursor: pointer; }
      .picker-tab[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); }
      .picker-tab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .channel-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 55px; align-items: center; gap: 10px; margin: 11px 0; font-size: 13px; font-weight: 700; }
      .channel-row input[type="range"] { width: 100%; accent-color: var(--ink); }
      .channel-row input[type="number"] { width: 55px; padding: 6px 4px; border: 1px solid var(--line-strong); border-radius: 5px; font: inherit; text-align: center; }
      .picker-preview { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; }
      .preview-hex { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      .preview-swatch { width: 28px; height: 28px; border: 1px solid rgba(0,0,0,.12); border-radius: 5px; background: var(--preview-color); }
      .copy-hex { margin-left: auto; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 700 11px var(--font); cursor: pointer; }
      .copy-hex:hover { background: var(--paper); }
      .picker-note { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
      .rgb-color-picker { display: grid; gap: 12px; margin-top: 8px; font-size: 12px; font-weight: 700; }
      .color-plane { position: relative; height: 170px; border-radius: 8px; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), hsl(var(--picker-hue, 0deg) 100% 50%); cursor: crosshair; touch-action: none; }
      .color-plane::after { content: ''; position: absolute; left: var(--picker-saturation, 100%); top: var(--picker-value, 0%); width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.55); transform: translate(-50%, -50%); pointer-events: none; }
      .color-plane:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      .hue-control { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
      .hue-control input { width: 100%; accent-color: var(--ink); }
      .shade-slider { appearance: none; display: block; width: 100%; height: 16px; margin: 12px 0 8px; border-radius: 12px; cursor: pointer; }
      .shade-slider::-moz-range-track { height: 16px; border-radius: 12px; background: transparent; }
      .shade-slider::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; border: 3px solid #fff; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
      .shade-slider::-moz-range-thumb { width: 16px; height: 16px; border: 3px solid #fff; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
      .shade-slider:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
      .shade-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
      .steal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .steal-button { padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 700 12px var(--font); cursor: pointer; }
      .steal-button:hover { background: var(--paper); }
      .steal-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .steal-drop { display: grid; place-items: center; min-height: 120px; margin-top: 10px; padding: 12px; border: 2px dashed var(--line-strong); border-radius: 8px; color: var(--muted); font-size: 12px; text-align: center; }
      .steal-drop.dragging { border-color: var(--ink); background: var(--paper); }
      .steal-canvas { display: block; max-width: 100%; max-height: 220px; margin: 10px auto 0; border-radius: 6px; cursor: crosshair; touch-action: none; }

      .square-control {
        position: absolute;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(41, 40, 36, 0.72);
        color: #fff;
        font: 18px/1 var(--font);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease;
      }

      .square:hover .square-control,
      .square:focus-within .square-control,
      .drag-ghost .square-control { opacity: 1; pointer-events: auto; }
      .square-control:hover { background: var(--ink); }
      .square-control:focus { outline: none; }
      .remove-button { top: 8px; right: 8px; }
      .resize-handle { z-index: 2; width: 14px; height: 48px; border-radius: 8px; background: rgba(41, 40, 36, 0.42); touch-action: none; }
      .resize-handle::after { content: ''; display: block; width: 3px; height: 24px; border-radius: 2px; background: var(--surface); }
      .resize-left { top: 50%; left: 0; transform: translateY(-50%); cursor: ew-resize; }
      .resize-right { top: 50%; right: 0; transform: translateY(-50%); cursor: ew-resize; }
      .resize-top { top: 0; left: 50%; width: 48px; height: 14px; transform: translateX(-50%); cursor: ns-resize; }
      .resize-bottom { bottom: 0; left: 50%; width: 48px; height: 14px; transform: translateX(-50%); cursor: ns-resize; }
      .resize-top::after, .resize-bottom::after { width: 24px; height: 3px; }
      .resize-handle[hidden] { display: none; }

      .add-button {
        position: fixed;
        right: 32px;
        bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font: 300 39px/1 var(--font);
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(41, 40, 36, 0.18);
        transition: transform 180ms ease, background 180ms ease;
      }

      .add-button:hover { transform: rotate(90deg); background: #48443d; }
      .add-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

      .options-button, .capture-button, .copy-picture-button {
        position: fixed;
        right: 106px;
        bottom: 37px;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(41, 40, 36, 0.18);
      }

      .options-button:hover, .options-button[aria-expanded="true"], .capture-button:hover, .copy-picture-button:hover { background: #f0ede7; }
      .options-button:focus-visible, .capture-button:focus-visible, .copy-picture-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
      .options-button svg, .capture-button svg { width: 20px; height: 20px; }
      .capture-button { right: 162px; }
      .copy-picture-button { right: 218px; bottom: 41px; width: 36px; height: 36px; }
      .copy-picture-button svg { width: 16px; height: 16px; }
      .options-popover { right: 32px; bottom: 104px; width: 260px; }
      .options-row { display: grid; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 700; }
      .options-row-header { display: flex; justify-content: space-between; }
      .options-row input[type="range"] { width: 100%; accent-color: var(--ink); }
      .background-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .background-swatch { width: 28px; height: 28px; padding: 0; border: 1px solid rgba(0,0,0,.18); border-radius: 50%; background: var(--swatch); cursor: pointer; }
      .background-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
      .background-swatch:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      .background-custom { width: 36px; height: 30px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }

      @media (max-width: 600px) {
        .options-button, .capture-button { right: 92px; bottom: 29px; }
        .capture-button { right: 148px; }
        .copy-picture-button { right: 204px; bottom: 33px; }
        .options-popover { right: 16px; bottom: 94px; }
        .site-header { padding: 24px; gap: 8px; }
        .header-note { display: none; }
        .add-button { right: 22px; bottom: 22px; width: 58px; height: 58px; }
      }

      @media (hover: none) {
        .square-control { opacity: 1; pointer-events: auto; }
        .remove-button { width: 34px; height: 34px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .square, .add-button { transition: none; }
        .cmyk-popover:not([hidden]) { animation: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1 class="brand">Color Squares</h1>
      <p class="header-note">A little space to play with color</p>
    </header>

    <main>
      <div class="grid" id="grid" aria-label="Color squares"></div>
    </main>

    <section class="cmyk-popover" id="cmyk-picker" role="dialog" aria-label="Color picker" hidden>
      <div class="picker-heading"><h2>Color</h2><button class="picker-close" id="picker-close" type="button" aria-label="Close color picker">×</button></div>
      <label class="picker-name">Name <input id="color-name" type="text" maxlength="80" placeholder="e.g. Nile blue" /></label>
      <div class="picker-tabs" role="tablist" aria-label="Color mode">
        <button class="picker-tab" id="cmyk-tab" type="button" role="tab" aria-controls="cmyk-panel" aria-selected="true" tabindex="0">CMYK</button>
        <button class="picker-tab" id="rgb-tab" type="button" role="tab" aria-controls="rgb-panel" aria-selected="false" tabindex="-1">RGB</button>
        <button class="picker-tab" id="shades-tab" type="button" role="tab" aria-controls="shades-panel" aria-selected="false" tabindex="-1">Shades</button>
        <button class="picker-tab" id="steal-tab" type="button" role="tab" aria-controls="steal-panel" aria-selected="false" tabindex="-1">Steal</button>
      </div>
      <div id="cmyk-panel" role="tabpanel" aria-labelledby="cmyk-tab">
        <div id="channels"></div>
        <p class="picker-note">Screen colors are an approximation of CMYK print colors.</p>
      </div>
      <div id="rgb-panel" role="tabpanel" aria-labelledby="rgb-tab" hidden>
        <div class="rgb-color-picker">
          <div class="color-plane" id="color-plane" role="application" tabindex="0" aria-label="Color field. Use pointer or arrow keys to choose saturation and brightness."></div>
          <label class="hue-control">Hue <input id="hue-slider" type="range" min="0" max="359" value="0" aria-label="Hue" /></label>
        </div>
      </div>
      <div id="shades-panel" role="tabpanel" aria-labelledby="shades-tab" hidden>
        <input class="shade-slider" id="shade-slider" type="range" min="0" max="100" value="50" aria-label="Shade from darker to lighter" />
        <div class="shade-scale"><span>Darker</span><span>Original</span><span>Lighter</span></div>
      </div>
      <div id="steal-panel" role="tabpanel" aria-labelledby="steal-tab" hidden>
        <div class="steal-actions">
          <button class="steal-button" id="steal-screen" type="button" hidden>Pick from screen</button>
          <button class="steal-button" id="steal-upload" type="button">Choose image…</button>
          <input id="steal-file" type="file" accept="image/*" hidden />
        </div>
        <div class="steal-drop" id="steal-drop">Drop or paste an image here, then click it to steal a color.</div>
        <canvas class="steal-canvas" id="steal-canvas" aria-label="Image to pick colors from" hidden></canvas>
      </div>
      <div class="picker-preview"><span class="preview-swatch" id="preview-swatch"></span><span class="preview-hex" id="preview-hex"></span><button class="copy-hex" id="copy-hex" type="button">Copy HEX</button></div>
    </section>

    <button class="options-button" id="options-button" type="button" aria-label="Options" title="Options" aria-expanded="false" aria-controls="options-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
    <section class="cmyk-popover options-popover" id="options-panel" role="dialog" aria-label="Options" hidden>
      <div class="picker-heading"><h2>Options</h2><button class="picker-close" id="options-close" type="button" aria-label="Close options">×</button></div>
      <label class="options-row">
        <span class="options-row-header">Space between squares <output id="gap-value">0 px</output></span>
        <input id="gap-slider" type="range" min="0" max="60" step="1" value="0" />
      </label>
      <label class="options-row">
        <span class="options-row-header">Corner radius <output id="radius-value">0 px</output></span>
        <input id="radius-slider" type="range" min="0" max="80" step="1" value="0" />
      </label>
      <div class="options-row" role="group" aria-labelledby="background-label">
        <span id="background-label">Background</span>
        <div class="background-controls" id="background-controls">
          <input class="background-custom" id="background-input" type="color" value="#f7f5f0" aria-label="Custom background color" />
        </div>
      </div>
    </section>
    <button class="copy-picture-button" id="copy-picture-button" type="button" aria-label="Copy a picture of the squares to the clipboard" title="Copy picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>
    </button>
    <button class="capture-button" id="capture-button" type="button" aria-label="Save a picture of the squares" title="Save a picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button class="add-button" id="add-square" type="button" aria-label="Add a square" title="Add a square">+</button>

    <script>
      const grid = document.querySelector('#grid');
      const addButton = document.querySelector('#add-square');
      const colors = ['#f27864', '#6769dd', '#eebd59', '#74b99b', '#cb8bbd', '#75a8cb'];
      const storageKey = 'color-squares-state-v1';
      const layoutKey = 'color-squares-layout-v1';
      const pickerPanel = document.querySelector('#cmyk-picker');
      const shadeSlider = document.querySelector('#shade-slider');
      const nameInput = document.querySelector('#color-name');
      const previewSwatch = document.querySelector('#preview-swatch');
      const previewHex = document.querySelector('#preview-hex');
      const copyHexButton = document.querySelector('#copy-hex');
      const colorPlane = document.querySelector('#color-plane');
      const hueSlider = document.querySelector('#hue-slider');
      const pickerTabs = [...document.querySelectorAll('.picker-tab')];
      const stealScreenButton = document.querySelector('#steal-screen');
      const stealFileInput = document.querySelector('#steal-file');
      const stealDrop = document.querySelector('#steal-drop');
      const stealCanvas = document.querySelector('#steal-canvas');
      const stealContext = stealCanvas.getContext('2d', { willReadFrequently: true });
      const channelNames = { c: 'Cyan', m: 'Magenta', y: 'Yellow', k: 'Black' };
      let activeSquare = null;
      let shadeBaseColor = null;
      let pickerSaturation = 1;
      let pickerValue = 1;
      let layoutColumns = [];
      let layoutRows = [];
      let columnCount = 1;
      let rowCount = 1;

      document.querySelector('#channels').innerHTML = Object.entries(channelNames).map(([channel, label]) => `
        <div class="channel-row" data-channel="${channel}">
          <span aria-hidden="true">${channel.toUpperCase()}</span>
          <input type="range" min="0" max="100" value="0" aria-label="${label}" />
          <input type="number" min="0" max="100" step="1" value="0" aria-label="${label} percent" />
        </div>
      `).join('');
      function cmykToHex({ c, m, y, k }) {
        const hex = [c, m, y].map((channel) =>
          Math.round(255 * (1 - channel / 100) * (1 - k / 100))
            .toString(16).padStart(2, '0')
        ).join('');
        return `#${hex}`;
      }

      function hexToCmyk(hex) {
        const [r, g, b] = [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16) / 255);
        const black = 1 - Math.max(r, g, b);
        if (black === 1) return { c: 0, m: 0, y: 0, k: 100 };
        return {
          c: Math.round(100 * (1 - r - black) / (1 - black)),
          m: Math.round(100 * (1 - g - black) / (1 - black)),
          y: Math.round(100 * (1 - b - black) / (1 - black)),
          k: Math.round(100 * black)
        };
      }

      function rgbToHsv(hex) {
        const rgb = [1, 3, 5].map((index) => parseInt(hex.slice(index, index + 2), 16) / 255);
        const [r, g, b] = rgb;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        let hue = 0;
        if (delta) {
          if (max === r) hue = 60 * (((g - b) / delta) % 6);
          else if (max === g) hue = 60 * ((b - r) / delta + 2);
          else hue = 60 * ((r - g) / delta + 4);
        }
        return { h: (hue + 360) % 360, s: max === 0 ? 0 : delta / max, v: max };
      }

      function hsvToHex(h, s, v) {
        const chroma = v * s;
        const x = chroma * (1 - Math.abs((h / 60) % 2 - 1));
        const m = v - chroma;
        const sectors = [[chroma, x, 0], [x, chroma, 0], [0, chroma, x], [0, x, chroma], [x, 0, chroma], [chroma, 0, x]];
        const rgb = sectors[Math.floor(h / 60) % 6].map((value) => Math.round((value + m) * 255));
        return `#${rgb.map((value) => value.toString(16).padStart(2, '0')).join('')}`;
      }

      function validCmyk(value) {
        return value && Object.keys(channelNames).every((channel) =>
          Number.isInteger(value[channel]) && value[channel] >= 0 && value[channel] <= 100
        );
      }

      function setSquareColor(square, color) {
        square.dataset.color = color;
        square.style.setProperty('--square-color', color);
        const [r, g, b] = [1, 3, 5].map((index) => parseInt(color.slice(index, index + 2), 16));
        square.style.setProperty('--square-label-color', 0.2126 * r + 0.7152 * g + 0.0722 * b > 150 ? '#292824' : '#fff');
        const hexLabel = square.querySelector('.square-hex');
        if (hexLabel) hexLabel.textContent = color.toUpperCase();
      }

      function positionPopover(squareElement, panel) {
        if (!squareElement || panel.hidden) return;
        const square = squareElement.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const left = Math.max(16, Math.min(square.left, window.innerWidth - panelRect.width - 16));
        const below = square.bottom + 12;
        const above = square.top - panelRect.height - 12;
        const top = below + panelRect.height <= window.innerHeight - 16 ? below
          : above >= 16 ? above
          : Math.max(16, Math.min(below, window.innerHeight - panelRect.height - 16));
        panel.style.left = `${left}px`;
        panel.style.top = `${top}px`;
      }

      function positionPicker() {
        positionPopover(activeSquare, pickerPanel);
      }

      function closePicker(restoreFocus = false) {
        const square = activeSquare;
        activeSquare = null;
        pickerPanel.hidden = true;
        if (restoreFocus && square?.isConnected) square.querySelector('.square-picker').focus();
      }

      function setPickerTab(tab) {
        pickerTabs.forEach((button) => {
          const selected = button === tab;
          button.setAttribute('aria-selected', String(selected));
          button.tabIndex = selected ? 0 : -1;
          document.getElementById(button.getAttribute('aria-controls')).hidden = !selected;
        });
        if (tab.id === 'shades-tab' && activeSquare) restoreShadeControls(activeSquare);
        positionPicker();
      }

      function syncPickerColor(color) {
        syncColorPlane(color);
        previewSwatch.style.setProperty('--preview-color', color);
        previewHex.textContent = color.toUpperCase();
      }

      function syncColorPlane(color) {
        const hsv = rgbToHsv(color);
        pickerSaturation = hsv.s;
        pickerValue = hsv.v;
        hueSlider.value = Math.round(hsv.h) % 360;
        colorPlane.style.setProperty('--picker-hue', `${hsv.h}deg`);
        colorPlane.style.setProperty('--picker-saturation', `${hsv.s * 100}%`);
        colorPlane.style.setProperty('--picker-value', `${(1 - hsv.v) * 100}%`);
      }

      function updateColorFromPlane() {
        const color = hsvToHex(Number(hueSlider.value), pickerSaturation, pickerValue);
        colorPlane.style.setProperty('--picker-hue', `${hueSlider.value}deg`);
        colorPlane.style.setProperty('--picker-saturation', `${pickerSaturation * 100}%`);
        colorPlane.style.setProperty('--picker-value', `${(1 - pickerValue) * 100}%`);
        applyRgb(color);
      }

      function selectPlaneColor(event) {
        const bounds = colorPlane.getBoundingClientRect();
        pickerSaturation = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        pickerValue = 1 - Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height));
        updateColorFromPlane();
      }

      colorPlane.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        colorPlane.setPointerCapture(event.pointerId);
        selectPlaneColor(event);
      });
      colorPlane.addEventListener('pointermove', (event) => {
        if (colorPlane.hasPointerCapture(event.pointerId)) selectPlaneColor(event);
      });
      colorPlane.addEventListener('keydown', (event) => {
        const step = event.shiftKey ? 0.05 : 0.01;
        if (event.key === 'ArrowLeft') pickerSaturation = Math.max(0, pickerSaturation - step);
        else if (event.key === 'ArrowRight') pickerSaturation = Math.min(1, pickerSaturation + step);
        else if (event.key === 'ArrowDown') pickerValue = Math.max(0, pickerValue - step);
        else if (event.key === 'ArrowUp') pickerValue = Math.min(1, pickerValue + step);
        else return;
        event.preventDefault();
        updateColorFromPlane();
      });
      hueSlider.addEventListener('input', updateColorFromPlane);

      // The shade origin stays fixed while sliding, so the original color is always back at the center.
      function restoreShadeControls(square) {
        if (!square.shadeBase) {
          square.shadeBase = square.dataset.color;
          square.shadeValue = 50;
        }
        const color = square.shadeBase;
        shadeBaseColor = color;
        shadeSlider.value = square.shadeValue;
        shadeSlider.style.background = `linear-gradient(to right, ${shadeColor(color, -0.6)}, ${color} 50%, ${shadeColor(color, 0.6)})`;
      }

      copyHexButton.addEventListener('click', async () => {
        if (!activeSquare) return;
        const color = activeSquare.dataset.color.toUpperCase();
        try {
          await navigator.clipboard.writeText(color);
          copyHexButton.textContent = 'Copied';
          window.setTimeout(() => { copyHexButton.textContent = 'Copy HEX'; }, 1200);
        } catch (_) {
          copyHexButton.textContent = 'Copy unavailable';
          window.setTimeout(() => { copyHexButton.textContent = 'Copy HEX'; }, 1600);
        }
      });

      function syncCmykControls(cmyk) {
        document.querySelectorAll('#channels .channel-row').forEach((row) => {
          const value = cmyk[row.dataset.channel];
          row.querySelector('input[type="range"]').value = value;
          row.querySelector('input[type="number"]').value = value;
        });
      }

      function openPicker(square) {
        activeSquare = square;
        nameInput.value = square.dataset.name || '';
        syncCmykControls(square.cmyk);
        syncPickerColor(square.dataset.color);
        restoreShadeControls(square);
        pickerPanel.hidden = false;
        positionPicker();
        nameInput.focus();
      }

      function shadeColor(color, amount) {
        const rgb = [1, 3, 5].map((index) => parseInt(color.slice(index, index + 2), 16));
        const target = amount < 0 ? 0 : 255;
        return `#${rgb.map((channel) => Math.round(channel + (target - channel) * Math.abs(amount))
          .toString(16).padStart(2, '0')).join('')}`;
      }

      shadeSlider.addEventListener('input', () => {
        if (!activeSquare) return;
        const amount = (Number(shadeSlider.value) - 50) / 50 * 0.6;
        const color = shadeColor(shadeBaseColor, amount);
        activeSquare.shadeValue = Number(shadeSlider.value);
        activeSquare.cmyk = hexToCmyk(color);
        setSquareColor(activeSquare, color);
        previewSwatch.style.setProperty('--preview-color', color);
        previewHex.textContent = color.toUpperCase();
        saveState();
      });

      function applyCmyk() {
        if (!activeSquare) return;
        activeSquare.cmyk = Object.fromEntries([...document.querySelectorAll('#channels .channel-row')].map((row) => [
          row.dataset.channel, Number(row.querySelector('input[type="range"]').value)
        ]));
        const color = cmykToHex(activeSquare.cmyk);
        setSquareColor(activeSquare, color);
        syncPickerColor(color);
        activeSquare.shadeBase = null;
        restoreShadeControls(activeSquare);
        saveState();
      }

      function applyRgb(color) {
        if (!activeSquare) return;
        activeSquare.cmyk = hexToCmyk(color);
        setSquareColor(activeSquare, color);
        syncCmykControls(activeSquare.cmyk);
        syncPickerColor(color);
        activeSquare.shadeBase = null;
        restoreShadeControls(activeSquare);
        saveState();
      }

      if ('EyeDropper' in window) {
        stealScreenButton.hidden = false;
        stealScreenButton.addEventListener('click', async () => {
          try {
            const { sRGBHex } = await new EyeDropper().open();
            const color = sRGBHex.startsWith('#') ? sRGBHex.toLowerCase()
              : `#${sRGBHex.match(/\d+/g).slice(0, 3).map((n) => Number(n).toString(16).padStart(2, '0')).join('')}`;
            applyRgb(color);
          } catch {
            // Picking was cancelled.
          }
        });
      }

      function loadStealImage(file) {
        if (!file?.type.startsWith('image/')) return;
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, 800 / Math.max(image.naturalWidth, image.naturalHeight));
          stealCanvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          stealCanvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          stealContext.drawImage(image, 0, 0, stealCanvas.width, stealCanvas.height);
          URL.revokeObjectURL(url);
          stealCanvas.hidden = false;
          stealDrop.hidden = true;
          positionPicker();
        };
        image.src = url;
      }

      function stealFromCanvas(event) {
        const bounds = stealCanvas.getBoundingClientRect();
        const x = Math.floor(Math.max(0, Math.min(bounds.width - 1, event.clientX - bounds.left)) * stealCanvas.width / bounds.width);
        const y = Math.floor(Math.max(0, Math.min(bounds.height - 1, event.clientY - bounds.top)) * stealCanvas.height / bounds.height);
        const [r, g, b] = stealContext.getImageData(x, y, 1, 1).data;
        applyRgb(`#${[r, g, b].map((channel) => channel.toString(16).padStart(2, '0')).join('')}`);
      }

      document.querySelector('#steal-upload').addEventListener('click', () => stealFileInput.click());
      stealFileInput.addEventListener('change', () => { loadStealImage(stealFileInput.files[0]); stealFileInput.value = ''; });
      [stealDrop, stealCanvas].forEach((target) => {
        target.addEventListener('dragover', (event) => { event.preventDefault(); stealDrop.classList.add('dragging'); });
        target.addEventListener('dragleave', () => stealDrop.classList.remove('dragging'));
        target.addEventListener('drop', (event) => {
          event.preventDefault();
          stealDrop.classList.remove('dragging');
          loadStealImage(event.dataTransfer.files[0]);
        });
      });
      document.addEventListener('paste', (event) => {
        if (!activeSquare || document.querySelector('#steal-panel').hidden) return;
        const item = [...event.clipboardData.items].find((entry) => entry.type.startsWith('image/'));
        if (item) loadStealImage(item.getAsFile());
      });
      stealCanvas.addEventListener('pointerdown', (event) => {
        stealCanvas.setPointerCapture(event.pointerId);
        stealFromCanvas(event);
      });
      stealCanvas.addEventListener('pointermove', (event) => {
        if (stealCanvas.hasPointerCapture(event.pointerId)) stealFromCanvas(event);
      });

      pickerTabs.forEach((tab, index) => {
        tab.addEventListener('click', () => setPickerTab(tab));
        tab.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'Home' ? 0 : event.key === 'End' ? pickerTabs.length - 1
            : (index + (event.key === 'ArrowRight' ? 1 : -1) + pickerTabs.length) % pickerTabs.length;
          setPickerTab(pickerTabs[next]);
          pickerTabs[next].focus();
        });
      });

      document.querySelectorAll('#channels .channel-row').forEach((row) => {
        const range = row.querySelector('input[type="range"]');
        const number = row.querySelector('input[type="number"]');
        range.addEventListener('input', () => { number.value = range.value; applyCmyk(); });
        number.addEventListener('input', () => {
          if (number.value === '') return;
          const value = Math.max(0, Math.min(100, Math.round(Number(number.value))));
          range.value = value;
          applyCmyk();
        });
        number.addEventListener('change', () => { number.value = range.value; });
      });

      nameInput.addEventListener('input', () => {
        if (!activeSquare) return;
        activeSquare.dataset.name = nameInput.value;
        const label = activeSquare.querySelector('.square-name');
        label.textContent = nameInput.value;
        label.hidden = !nameInput.value;
        saveState();
      });
      document.querySelector('#picker-close').addEventListener('click', () => closePicker(true));
      document.addEventListener('pointerdown', (event) => {
        if (activeSquare && !pickerPanel.contains(event.target) && !activeSquare.contains(event.target)) closePicker();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && activeSquare) closePicker(true);
      });

      function saveState() {
        const state = [...grid.children].map((square) => ({
          color: square.dataset.color,
          cmyk: square.cmyk,
          name: square.dataset.name || ''
        }));
        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
          localStorage.setItem(layoutKey, JSON.stringify({ count: state.length, columns: layoutColumns, rows: layoutRows }));
        } catch (_) {}
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === null) return null;
          const state = JSON.parse(saved);
          if (!Array.isArray(state)) return null;
          return state.filter((item) =>
            item && /^#[0-9a-f]{6}$/i.test(item.color)
          ).map((item) => ({
            ...item,
            cmyk: validCmyk(item.cmyk) ? item.cmyk : hexToCmyk(item.color),
            name: typeof item.name === 'string' ? item.name.slice(0, 80) : ''
          }));
        } catch (_) { return null; }
      }

      function loadLayout() {
        try {
          const saved = JSON.parse(localStorage.getItem(layoutKey));
          if (!saved || saved.count !== grid.children.length) return;
          if (Array.isArray(saved.columns) && saved.columns.every((value) => Number.isFinite(value) && value > 0)) layoutColumns = saved.columns;
          if (Array.isArray(saved.rows) && saved.rows.every((value) => Number.isFinite(value) && value > 0)) layoutRows = saved.rows;
        } catch (_) {}
      }

      function updateGrid() {
        const count = grid.children.length;
        const aspect = grid.clientWidth / Math.max(1, grid.clientHeight);
        columnCount = Math.max(1, Math.min(count, Math.round(Math.sqrt(count * aspect))));
        rowCount = Math.max(1, Math.ceil(count / columnCount));
        if (layoutColumns.length !== columnCount) layoutColumns = Array(columnCount).fill(1);
        if (layoutRows.length !== rowCount) layoutRows = Array(rowCount).fill(1);
        grid.style.gridTemplateColumns = layoutColumns.map((value) => `minmax(0, ${value}fr)`).join(' ');
        grid.style.gridTemplateRows = layoutRows.map((value) => `minmax(0, ${value}fr)`).join(' ');
        [...grid.children].forEach((square, index) => {
          const column = index % columnCount;
          const row = Math.floor(index / columnCount);
          const span = index === count - 1 ? columnCount - column : 1;
          const left = column === 0;
          const right = column + span === columnCount;
          const top = row === 0;
          const bottom = row === rowCount - 1;
          square.style.gridColumn = `span ${span}`;
          square.querySelector('.resize-left').hidden = left;
          square.querySelector('.resize-right').hidden = right;
          square.querySelector('.resize-top').hidden = top;
          square.querySelector('.resize-bottom').hidden = bottom;
          // Round only corners facing other squares; corners on the grid's outer edge stay square.
          const corner = (outer) => (outer ? '0' : 'var(--square-radius, 0px)');
          square.style.borderRadius = [
            corner(top || left), corner(top || right), corner(bottom || right), corner(bottom || left)
          ].join(' ');
        });
      }

      function updateLabels() {
        [...grid.children].forEach((square, index) => {
          const number = index + 1;
          square.querySelector('.square-picker').setAttribute('aria-label', `Edit color for square ${number}`);
          square.querySelector('.remove-button').setAttribute('aria-label', `Remove square ${number}`);
          ['left', 'right', 'top', 'bottom'].forEach((side) => {
            square.querySelector(`.resize-${side}`).setAttribute('aria-label', `Resize ${side} edge of square ${number}`);
          });
        });
      }

      function animateReorder(change) {
        const before = new Map([...grid.children].map((square) => [square, square.getBoundingClientRect()]));
        change();
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        [...grid.children].forEach((square) => {
          if (square.classList.contains('is-dragging')) return;
          const old = before.get(square);
          if (!old) return;
          const now = square.getBoundingClientRect();
          const dx = old.left - now.left;
          const dy = old.top - now.top;
          if (dx || dy) square.animate(
            [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
            { duration: 250, easing: 'cubic-bezier(.2,.8,.2,1)' }
          );
        });
      }

      function adjustBoundary(axis, boundary, delta, startWeights) {
        const weights = axis === 'x' ? layoutColumns : layoutRows;
        const size = axis === 'x' ? grid.clientWidth : grid.clientHeight;
        const totalWeight = startWeights.reduce((sum, value) => sum + value, 0);
        const pair = startWeights[boundary] + startWeights[boundary + 1];
        const minimum = Math.min(48 / Math.max(1, size) * totalWeight, pair / 3);
        const first = Math.max(minimum, Math.min(pair - minimum,
          startWeights[boundary] + delta / Math.max(1, size) * totalWeight));
        weights[boundary] = first;
        weights[boundary + 1] = pair - first;
        updateGrid();
        positionPicker();
      }

      function resizeBoundary(event, square, side) {
        if (event.button !== 0) return;
        event.preventDefault();
        event.currentTarget.focus();
        if (activeSquare) closePicker();
        const index = [...grid.children].indexOf(square);
        const column = index % columnCount;
        const row = Math.floor(index / columnCount);
        const axis = side === 'left' || side === 'right' ? 'x' : 'y';
        const boundary = axis === 'x' ? column - (side === 'left' ? 1 : 0)
          : row - (side === 'top' ? 1 : 0);
        const start = axis === 'x' ? event.clientX : event.clientY;
        const startWeights = [...(axis === 'x' ? layoutColumns : layoutRows)];

        function move(moveEvent) {
          if (moveEvent.pointerId !== event.pointerId) return;
          adjustBoundary(axis, boundary, (axis === 'x' ? moveEvent.clientX : moveEvent.clientY) - start, startWeights);
        }

        function finish(endEvent) {
          if (endEvent.pointerId !== event.pointerId) return;
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', finish);
          window.removeEventListener('pointercancel', finish);
          saveState();
        }

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', finish);
        window.addEventListener('pointercancel', finish);
      }

      function resizeWithKeyboard(event, square, side) {
        const axis = side === 'left' || side === 'right' ? 'x' : 'y';
        const direction = axis === 'x'
          ? event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0
          : event.key === 'ArrowDown' ? 1 : event.key === 'ArrowUp' ? -1 : 0;
        if (!direction) return;
        event.preventDefault();
        const index = [...grid.children].indexOf(square);
        const boundary = axis === 'x' ? index % columnCount - (side === 'left' ? 1 : 0)
          : Math.floor(index / columnCount) - (side === 'top' ? 1 : 0);
        const weights = [...(axis === 'x' ? layoutColumns : layoutRows)];
        adjustBoundary(axis, boundary, direction * 16, weights);
        saveState();
      }

      function startDrag(event, square) {
        if (event.button !== 0) return;
        if (activeSquare) closePicker();
        const startX = event.clientX;
        const startY = event.clientY;
        let ghost = null;

        function move(moveEvent) {
          if (moveEvent.pointerId !== event.pointerId) return;
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          if (!ghost && Math.hypot(dx, dy) < 5) return;
          if (!ghost) {
            const rect = square.getBoundingClientRect();
            ghost = square.cloneNode(true);
            ghost.classList.add('drag-ghost');
            ghost.inert = true;
            ghost.setAttribute('aria-hidden', 'true');
            ghost.style.left = `${rect.left}px`;
            ghost.style.top = `${rect.top}px`;
            ghost.style.width = `${rect.width}px`;
            ghost.style.height = `${rect.height}px`;
            ghost.style.gridColumn = 'auto';
            ghost.style.gridRow = 'auto';
            document.body.append(ghost);
            square.classList.add('is-dragging');
          }
          ghost.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

          const target = document.elementsFromPoint(moveEvent.clientX, moveEvent.clientY)
            .map((element) => element.closest?.('.square'))
            .find((element) => element && element !== square && element !== ghost);
          if (!target) return;

          const rect = target.getBoundingClientRect();
          const nearMiddle = Math.abs(moveEvent.clientY - (rect.top + rect.height / 2)) < rect.height / 3;
          const after = nearMiddle
            ? moveEvent.clientX > rect.left + rect.width / 2
            : moveEvent.clientY > rect.top + rect.height / 2;
          if (after && target.nextElementSibling === square) return;
          if (!after && square.nextElementSibling === target) return;

          animateReorder(() => {
            if (after) target.after(square);
            else target.before(square);
            updateGrid();
          });
          updateLabels();
        }

        function finish(endEvent) {
          if (endEvent.pointerId !== event.pointerId) return;
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', finish);
          window.removeEventListener('pointercancel', finish);
          if (ghost) {
            ghost.remove();
            square.classList.remove('is-dragging');
            square.suppressPickerClick = true;
            window.setTimeout(() => { square.suppressPickerClick = false; }, 100);
            saveState();
          }
        }

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', finish);
        window.addEventListener('pointercancel', finish);
      }

      function createSquare(color, cmyk = hexToCmyk(color), name = '') {
        const square = document.createElement('div');
        const picker = document.createElement('button');
        const swatchLabel = document.createElement('span');
        const nameLabel = document.createElement('span');
        const hexLabel = document.createElement('span');
        const removeButton = document.createElement('button');
        const resizeHandles = ['left', 'right', 'top', 'bottom'].map((side) => {
          const button = document.createElement('button');
          button.className = `square-control resize-handle resize-${side}`;
          button.type = 'button';
          button.title = `Drag to resize ${side} edge`;
          button.addEventListener('pointerdown', (event) => resizeBoundary(event, square, side));
          button.addEventListener('keydown', (event) => resizeWithKeyboard(event, square, side));
          return button;
        });

        square.className = 'square';
        square.cmyk = cmyk;
        square.dataset.name = name;
        setSquareColor(square, color);
        picker.className = 'square-picker';
        picker.type = 'button';
        picker.addEventListener('pointerdown', (event) => startDrag(event, square));
        picker.addEventListener('keydown', (event) => {
          const forward = event.key === 'ArrowRight' || event.key === 'ArrowDown';
          const backward = event.key === 'ArrowLeft' || event.key === 'ArrowUp';
          if (!forward && !backward) return;
          const neighbor = forward ? square.nextElementSibling : square.previousElementSibling;
          if (!neighbor) return;
          event.preventDefault();
          animateReorder(() => {
            if (forward) neighbor.after(square);
            else neighbor.before(square);
            updateGrid();
          });
          updateLabels();
          saveState();
        });
        picker.addEventListener('click', (event) => {
          if (square.suppressPickerClick) {
            event.preventDefault();
            square.suppressPickerClick = false;
            return;
          }
          openPicker(square);
        });
        nameLabel.className = 'square-name';
        nameLabel.textContent = name;
        nameLabel.hidden = !name;
        hexLabel.className = 'square-hex';
        hexLabel.textContent = color.toUpperCase();
        swatchLabel.className = 'swatch-label';
        swatchLabel.append(nameLabel, hexLabel);

        removeButton.className = 'square-control remove-button';
        removeButton.type = 'button';
        removeButton.textContent = '×';
        removeButton.addEventListener('click', () => {
          if (activeSquare === square) closePicker();
          const nextFocus = square.nextElementSibling?.querySelector('.remove-button')
            || square.previousElementSibling?.querySelector('.remove-button')
            || addButton;
          animateReorder(() => {
            square.remove();
            updateGrid();
          });
          updateLabels();
          saveState();
          nextFocus.focus();
        });

        square.append(picker, swatchLabel, removeButton, ...resizeHandles);
        grid.append(square);
      }

      function addSquare() {
        createSquare(colors[grid.children.length % colors.length]);
        updateGrid();
        updateLabels();
        saveState();
      }

      function render(state) {
        if (activeSquare) closePicker();
        grid.replaceChildren();
        (state ?? [{ color: colors[0] }, { color: colors[1] }])
          .forEach(({ color, cmyk, name }) => createSquare(color, cmyk, name));
        layoutColumns = [];
        layoutRows = [];
        loadLayout();
        updateGrid();
        updateLabels();
      }

      const optionsKey = 'color-squares-options-v1';
      const optionsButton = document.querySelector('#options-button');
      const optionsPanel = document.querySelector('#options-panel');
      const gapSlider = document.querySelector('#gap-slider');
      const gapValue = document.querySelector('#gap-value');
      const radiusSlider = document.querySelector('#radius-slider');
      const radiusValue = document.querySelector('#radius-value');
      const backgroundInput = document.querySelector('#background-input');
      const backgroundPresets = ['#f7f5f0', '#ffffff', '#e4e1da', '#292824', '#111111'];
      const options = { gap: 0, radius: 0, background: '#f7f5f0' };

      backgroundInput.before(...backgroundPresets.map((color) => {
        const swatch = document.createElement('button');
        swatch.className = 'background-swatch';
        swatch.type = 'button';
        swatch.dataset.color = color;
        swatch.style.setProperty('--swatch', color);
        swatch.setAttribute('aria-label', `Background ${color.toUpperCase()}`);
        swatch.addEventListener('click', () => { options.background = color; applyOptions(); saveOptions(); });
        return swatch;
      }));

      function applyOptions() {
        grid.style.setProperty('--square-gap', `${options.gap}px`);
        gapSlider.value = options.gap;
        gapValue.textContent = `${options.gap} px`;
        grid.style.setProperty('--square-radius', `${options.radius}px`);
        radiusSlider.value = options.radius;
        radiusValue.textContent = `${options.radius} px`;
        document.documentElement.style.setProperty('--page-background', options.background);
        document.querySelector('meta[name="theme-color"]').content = options.background;
        backgroundInput.value = options.background;
        document.querySelectorAll('.background-swatch').forEach((swatch) =>
          swatch.setAttribute('aria-pressed', String(swatch.dataset.color === options.background)));
        positionPicker();
      }

      function saveOptions() {
        try { localStorage.setItem(optionsKey, JSON.stringify(options)); } catch (_) {}
      }

      function loadOptions() {
        try {
          const saved = JSON.parse(localStorage.getItem(optionsKey));
          if (Number.isFinite(saved?.gap)) options.gap = Math.max(0, Math.min(60, Math.round(saved.gap)));
          if (Number.isFinite(saved?.radius)) options.radius = Math.max(0, Math.min(80, Math.round(saved.radius)));
          if (/^#[0-9a-f]{6}$/i.test(saved?.background)) options.background = saved.background.toLowerCase();
        } catch (_) {}
        applyOptions();
      }

      function setOptionsOpen(open, restoreFocus = false) {
        optionsPanel.hidden = !open;
        optionsButton.setAttribute('aria-expanded', String(open));
        if (open) {
          if (activeSquare) closePicker();
          gapSlider.focus();
        } else if (restoreFocus) optionsButton.focus();
      }

      optionsButton.addEventListener('click', () => setOptionsOpen(optionsPanel.hidden));
      document.querySelector('#options-close').addEventListener('click', () => setOptionsOpen(false, true));
      gapSlider.addEventListener('input', () => { options.gap = Number(gapSlider.value); applyOptions(); saveOptions(); });
      radiusSlider.addEventListener('input', () => { options.radius = Number(radiusSlider.value); applyOptions(); saveOptions(); });
      backgroundInput.addEventListener('input', () => { options.background = backgroundInput.value; applyOptions(); saveOptions(); });
      document.addEventListener('pointerdown', (event) => {
        if (!optionsPanel.hidden && !optionsPanel.contains(event.target) && !optionsButton.contains(event.target)) setOptionsOpen(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !optionsPanel.hidden) setOptionsOpen(false, true);
      });

      // Copies the on-screen name and hex label, using the rendered positions and fonts.
      function drawSwatchLabel(context, square, bounds) {
        const label = square.querySelector('.swatch-label');
        if (getComputedStyle(label).display === 'none') return;
        // Keep the same inset on the right as on the left, like the label's max-width does.
        const squareRect = square.getBoundingClientRect();
        const maxRight = squareRect.right - (label.getBoundingClientRect().left - squareRect.left) - bounds.left;
        label.querySelectorAll('.square-name:not([hidden]), .square-hex').forEach((text) => {
          const rect = text.getBoundingClientRect();
          const style = getComputedStyle(text);
          const x = rect.left - bounds.left;
          context.save();
          context.beginPath();
          context.rect(x, rect.top - bounds.top, Math.max(0, maxRight - x), rect.height);
          context.clip();
          context.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          if ('letterSpacing' in context) context.letterSpacing = style.letterSpacing === 'normal' ? '0px' : style.letterSpacing;
          context.globalAlpha = Number(style.opacity);
          context.fillStyle = style.color;
          context.textBaseline = 'middle';
          context.fillText(text.textContent, x, rect.top - bounds.top + rect.height / 2);
          context.restore();
        });
      }

      // Paints the squares straight onto a canvas, so handles and buttons never end up in the picture.
      function renderPicture() {
        const bounds = grid.getBoundingClientRect();
        const scale = Math.max(2, window.devicePixelRatio || 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bounds.width * scale);
        canvas.height = Math.round(bounds.height * scale);
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        context.fillStyle = options.background;
        context.fillRect(0, 0, bounds.width, bounds.height);
        [...grid.children].forEach((square) => {
          const rect = square.getBoundingClientRect();
          const style = getComputedStyle(square);
          const radii = ['borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomRightRadius', 'borderBottomLeftRadius']
            .map((corner) => parseFloat(style[corner]) || 0);
          context.fillStyle = square.dataset.color;
          context.beginPath();
          if (context.roundRect) context.roundRect(rect.left - bounds.left, rect.top - bounds.top, rect.width, rect.height, radii);
          else context.rect(rect.left - bounds.left, rect.top - bounds.top, rect.width, rect.height);
          context.fill();
          drawSwatchLabel(context, square, bounds);
        });
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      }

      function savePicture() {
        renderPicture().then((blob) => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'color-squares.png';
          link.click();
          window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        });
      }

      const copyPictureButton = document.querySelector('#copy-picture-button');
      const copyPictureIcon = copyPictureButton.innerHTML;
      const copiedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

      async function copyPicture() {
        try {
          // Safari only allows the write if the ClipboardItem is created during the click, so it gets the blob as a promise.
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': renderPicture() })]);
          copyPictureButton.title = 'Copied';
          copyPictureButton.innerHTML = copiedIcon;
        } catch (_) {
          copyPictureButton.title = 'Copy unavailable';
        }
        window.setTimeout(() => {
          copyPictureButton.title = 'Copy picture';
          copyPictureButton.innerHTML = copyPictureIcon;
        }, 1600);
      }

      document.querySelector('#capture-button').addEventListener('click', savePicture);
      copyPictureButton.addEventListener('click', copyPicture);
      addButton.addEventListener('click', addSquare);
      window.addEventListener('resize', () => { updateGrid(); positionPicker(); });
      window.addEventListener('scroll', positionPicker, true);
      window.addEventListener('storage', (event) => {
        if (event.key === storageKey) render(loadState());
        if (event.key === optionsKey) loadOptions();
        if (event.key === layoutKey) {
          layoutColumns = [];
          layoutRows = [];
          loadLayout();
          updateGrid();
        }
      });
      render(loadState());
      loadOptions();
    </script>
  </body>
</html>
